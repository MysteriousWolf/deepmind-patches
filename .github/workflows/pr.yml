name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

# A new push to the same pull request supersedes the run in progress.
concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  patches:
    name: Patches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the tool
        run: cargo build -p validate --release --locked
      - name: Validate every patch
        run: target/release/validate check --github
      - name: Check every version moved as the change needs
        id: versioning
        if: github.event_name == 'pull_request'
        run: target/release/validate versioning --base "origin/${{ github.base_ref }}"
      - name: Check the icon preview is current
        run: target/release/validate icons --write docs/icons.md --check
      - name: Summarise changed patches
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## Patches in this pull request"
            echo
            target/release/validate pr-summary --base "origin/${{ github.base_ref }}"
            echo
            echo "This change needs a \`${{ steps.versioning.outputs.needs }}\` bump; the version is \`${{ steps.versioning.outputs.version }}\`."
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && steps.versioning.outputs.needs != 'none'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8');
            const marker = '<!-- validate:pr-summary -->';
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number, per_page: 100,
            });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            const full = `${marker}\n${body}`;
            if (mine) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body: full });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body: full });
            }

  toml:
    name: TOML formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: uncenter/setup-taplo@v2
      - run: taplo fmt --check

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Check the crate packages on its own
        run: cargo package -p deepmind-patches --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features --locked

  msrv:
    name: Builds on the minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          MSRV="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "deepmind-patches") | .rust_version')"
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"
          echo "rust-version is $MSRV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked

  deps:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Advisories, licences, bans and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - name: Unused dependencies
        run: cargo machete

  version:
    name: Version
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the tool
        run: cargo build -p validate --release --locked
      - name: Check every version moved as the change needs
        id: version
        run: target/release/validate versioning --base "origin/${{ github.base_ref }}"
      - name: Check the new version is not released yet
        if: steps.version.outputs.bump != 'none'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error file=crates/deepmind-patches/Cargo.toml::v$VERSION is already tagged"
            exit 1
          fi
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -A 'deepmind-patches check workflow' "https://crates.io/api/v1/crates/deepmind-patches/$VERSION")"
          if [ "$STATUS" = "200" ]; then
            echo "::error file=crates/deepmind-patches/Cargo.toml::deepmind-patches $VERSION is already on crates.io"
            exit 1
          fi
      - name: Check the public API moved no further than the version says
        if: steps.version.outputs.bump != 'none' && steps.version.outputs.code_changed == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: deepmind-patches
          feature-group: all-features
          baseline-rev: origin/${{ github.base_ref }}

  workflows:
    name: Workflows and spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the workflows
        uses: raven-actions/actionlint@v2
      - name: Spelling
        uses: crate-ci/typos@v1

  api-docs:
    name: API reference is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate docs/api
        run: tools/api-docs.sh
      - name: Compare with what is committed
        run: |
          if ! git diff --exit-code --stat docs/api; then
            echo "::error::docs/api is stale. Run tools/api-docs.sh and commit the result."
            exit 1
          fi
