name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part to bump. auto reads it from the changes since the last tag.
        type: choice
        default: auto
        options: [auto, patch, release, year]

permissions:
  contents: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the tool
        run: cargo build -p validate --release --locked

      - name: Validate
        run: target/release/validate check --github

      - name: Compute the version
        id: version
        run: |
          VERSION="$(target/release/validate next-version --bump "${{ inputs.bump }}")"
          PREVIOUS="$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous=$PREVIOUS" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (previous: ${PREVIOUS:-none})"

      - name: Build the index
        run: >
          target/release/validate index
          --out index.toml
          --version "${{ steps.version.outputs.version }}"
          --commit "$GITHUB_SHA"

      - name: Bundle
        run: |
          tar czf patches.tar.gz presets
          tar czf demos.tar.gz demos

      - name: Write the notes
        run: |
          if [ -n "${{ steps.version.outputs.previous }}" ]; then
            target/release/validate notes --since "${{ steps.version.outputs.previous }}" --version "${{ steps.version.outputs.version }}" > notes.md
          else
            target/release/validate notes --version "${{ steps.version.outputs.version }}" > notes.md
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            index.toml patches.tar.gz demos.tar.gz

      # The crate has its own version. It is published when the version in
      # its Cargo.toml is not on crates.io yet, so a release that changed no
      # code publishes nothing.
      - name: Publish the crate if its version is new
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "deepmind-patches") | .version')"
          STATUS="$(curl -s -o /dev/null -w '%{http_code}' -A 'deepmind-patches release workflow' "https://crates.io/api/v1/crates/deepmind-patches/$VERSION")"
          if [ "$STATUS" = "200" ]; then
            echo "deepmind-patches $VERSION is already on crates.io; not publishing"
          else
            cargo publish -p deepmind-patches --locked
          fi
