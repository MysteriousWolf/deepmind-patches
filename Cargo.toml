[workspace]
resolver = "3"
members = ["crates/deepmind-patches", "tools/validate"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/MysteriousWolf/deepmind-patches"

[workspace.dependencies]
deepmind-midi = "26.5"
serde = { version = "1", features = ["derive"] }
toml = "1"
sha2 = "0.11"
thiserror = "2"
spdx = "0.13"
walkdir = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
ureq = "3"
flate2 = "1"
tar = "0.4"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
