<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 208" width="960" height="208" role="img" aria-label="deepmind-patches">
  <title>deepmind-patches</title>
  <!--
    The front of the unit, wide, laid out as deepmind-midi's banner is: wooden
    end cheeks, a dark panel, the mark from logo.svg on the left, and the
    project name in the same metal with the wordmark's slices through it.

    The name is outlined from Liberation Sans Bold so that it renders the same
    everywhere, tracked -20 units of the 2048 em, and fitted to the box the
    library's name occupies: ink from x 244.5 to x 884.5 on a baseline of 130.
    A longer name in the same box is a smaller name, and the slices are scaled
    with it about the baseline, which is why they are not the round numbers the
    library's are.
  -->
  <defs>
    <clipPath id="case"><rect width="960" height="208" rx="30"/></clipPath>
    <clipPath id="cheeks">
      <rect x="0" width="24" height="208"/>
      <rect x="936" width="24" height="208"/>
    </clipPath>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9552c"/>
      <stop offset="1" stop-color="#8a3f1f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282c36"/>
      <stop offset="1" stop-color="#15181e"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f8"/>
      <stop offset="0.5" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8e939f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2247"/>
      <stop offset="1" stop-color="#081633"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5f8"/>
      <stop offset="0.55" stop-color="#c9cdd6"/>
      <stop offset="1" stop-color="#8e939f"/>
    </linearGradient>
    <mask id="cuts">
      <rect width="128" height="128" fill="#fff"/>
      <rect x="0" y="52" width="128" height="1" fill="#000"/>
      <rect x="0" y="58.5" width="128" height="1.3" fill="#000"/>
      <rect x="0" y="65" width="128" height="1.6" fill="#000"/>
      <rect x="0" y="71.5" width="128" height="2" fill="#000"/>
      <rect x="0" y="78" width="128" height="2.4" fill="#000"/>
      <rect x="0" y="84.5" width="128" height="2.8" fill="#000"/>
      <rect x="0" y="91" width="128" height="3.2" fill="#000"/>
      <rect x="0" y="97.5" width="128" height="3.6" fill="#000"/>
    </mask>
    <mask id="textcuts">
      <rect width="960" height="208" fill="#fff"/>
      <rect x="0" y="106.010" width="960" height="0.960" fill="#000"/>
      <rect x="0" y="110.808" width="960" height="1.359" fill="#000"/>
      <rect x="0" y="115.606" width="960" height="1.759" fill="#000"/>
      <rect x="0" y="120.404" width="960" height="2.239" fill="#000"/>
      <rect x="0" y="125.202" width="960" height="2.719" fill="#000"/>
    </mask>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <filter id="textdrop" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g clip-path="url(#case)">
    <rect width="960" height="208" fill="url(#wood)"/>
    <g clip-path="url(#cheeks)" fill="none" stroke-linecap="round">
      <g stroke="#6f3116" stroke-width="2" opacity="0.7">
        <path d="M 6 -6 C 4 50 10 100 7 150 S 6 200 8 214"/>
        <path d="M 16 -6 C 18 42 13 92 16 142 S 18 192 15 214"/>
        <path d="M 942 -6 C 940 50 946 100 943 150 S 942 200 944 214"/>
        <path d="M 952 -6 C 954 42 949 92 952 142 S 954 192 951 214"/>
      </g>
      <g stroke="#c26436" stroke-width="1.5" opacity="0.55">
        <path d="M 11 -6 C 9 58 13 108 11 158 S 10 200 11 214"/>
        <path d="M 21 -6 C 22 66 19 116 21 166 S 22 205 20 214"/>
        <path d="M 947 -6 C 945 58 949 108 947 158 S 946 200 947 214"/>
        <path d="M 957 -6 C 958 66 955 116 957 166 S 958 205 956 214"/>
      </g>
    </g>
    <rect x="24" width="912" height="208" fill="url(#panel)"/>
    <rect x="24" width="2.4" height="208" fill="#000" opacity="0.5"/>
    <rect x="933.6" width="2.4" height="208" fill="#000" opacity="0.5"/>
    <rect x="26.4" width="1.4" height="208" fill="#454b58"/>
    <rect x="932.2" width="1.4" height="208" fill="#454b58"/>
  </g>

  <!-- The display, as drawn in logo.svg. -->
  <g transform="translate(44 11) scale(1.45)">
      <!-- The display: a recess in the panel, the glass, and the dot matrix. -->
      <rect x="24" y="38" width="80" height="52" rx="3" fill="#0b0d11"/>
      <rect x="25.5" y="39.5" width="77" height="49" rx="2.2" fill="url(#glass)"/>
      <!-- Unlit dots, eleven by seven on a pitch of 6, centred on the case. -->
      <g fill="#173058">
        <g id="row"><circle cx="34" cy="46" r="2.1"/><circle cx="40" cy="46" r="2.1"/><circle cx="46" cy="46" r="2.1"/><circle cx="52" cy="46" r="2.1"/><circle cx="58" cy="46" r="2.1"/><circle cx="64" cy="46" r="2.1"/><circle cx="70" cy="46" r="2.1"/><circle cx="76" cy="46" r="2.1"/><circle cx="82" cy="46" r="2.1"/><circle cx="88" cy="46" r="2.1"/><circle cx="94" cy="46" r="2.1"/></g>
        <use href="#row" y="6"/><use href="#row" y="12"/><use href="#row" y="18"/><use href="#row" y="24"/><use href="#row" y="30"/><use href="#row" y="36"/>
      </g>
      <!-- Lit dots: A, a gap, 1. -->
      <g id="lit" fill="#dfeaff">
        <circle cx="40" cy="46" r="2.1"/><circle cx="46" cy="46" r="2.1"/><circle cx="52" cy="46" r="2.1"/>
        <circle cx="34" cy="52" r="2.1"/><circle cx="58" cy="52" r="2.1"/>
        <circle cx="34" cy="58" r="2.1"/><circle cx="58" cy="58" r="2.1"/>
        <circle cx="34" cy="64" r="2.1"/><circle cx="40" cy="64" r="2.1"/><circle cx="46" cy="64" r="2.1"/><circle cx="52" cy="64" r="2.1"/><circle cx="58" cy="64" r="2.1"/>
        <circle cx="34" cy="70" r="2.1"/><circle cx="58" cy="70" r="2.1"/>
        <circle cx="34" cy="76" r="2.1"/><circle cx="58" cy="76" r="2.1"/>
        <circle cx="34" cy="82" r="2.1"/><circle cx="58" cy="82" r="2.1"/>
        <circle cx="82" cy="46" r="2.1"/>
        <circle cx="76" cy="52" r="2.1"/><circle cx="82" cy="52" r="2.1"/>
        <circle cx="82" cy="58" r="2.1"/>
        <circle cx="82" cy="64" r="2.1"/>
        <circle cx="82" cy="70" r="2.1"/>
        <circle cx="82" cy="76" r="2.1"/>
        <circle cx="76" cy="82" r="2.1"/><circle cx="82" cy="82" r="2.1"/><circle cx="88" cy="82" r="2.1"/>
      </g>
      <use href="#lit" filter="url(#glow)" opacity="0.55"/>
      <!-- A reflection across the top of the glass. -->
      <path d="M 26.5 41 h 75 a 1.2 1.2 0 0 1 1.2 1.2 v 5 q -38 5 -77.4 0 v -5 a 1.2 1.2 0 0 1 1.2 -1.2 z" fill="#ffffff" opacity="0.06"/>
      <!-- The bezel, in the same metal, sliced like the socket's. -->
      <g filter="url(#drop)">
        <rect x="24" y="38" width="80" height="52" rx="3" fill="none" stroke="url(#metal)" stroke-width="5" mask="url(#cuts)"/>
      </g>
      <rect x="21" y="35" width="86" height="58" rx="5" fill="none" stroke="#000" stroke-width="0.8" opacity="0.5" mask="url(#cuts)"/>
  </g>

  <!-- The name, in the same metal, sliced like the wordmark. -->
